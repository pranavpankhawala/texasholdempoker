<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0f17">
  <meta name="description" content="Texas Hold'em standings: season points, chips, game history and the live table.">
  <title>Hold'em Standings</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2310b981'/%3E%3Cpath d='M16 7c-4 5-8 7-8 11a4 4 0 0 0 7 2.6L14 25h4l-1-4.4A4 4 0 0 0 24 18c0-4-4-6-8-11z' fill='%23052e22'/%3E%3C/svg%3E">
  <script src="assets/viewer/theme.js"></script>
  <link rel="stylesheet" href="assets/viewer/viewer.css">
  <script type="module" src="assets/viewer/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to standings</a>
  <div class="ambient" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="site-head glass">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4-7 6.3-7 10a4 4 0 0 0 6.2 3.3L10 21h4l-1.2-5.2A4 4 0 0 0 19 12.5c0-3.7-4-6-7-10z"/></svg>
      </span>
      <span class="brand-name">Hold'em Standings</span>
    </div>
    <nav class="head-actions" aria-label="Site">
      <button id="theme-toggle" type="button" class="btn ghost sm" aria-pressed="true" aria-label="Dark theme">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="label" aria-hidden="true">Dark</span>
      </button>
      <a class="btn ghost sm" href="admin.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Admin</span>
      </a>
    </nav>
  </header>

  <div class="page">
    <h1 class="page-title">Texas Hold'em standings</h1>

    <div class="toolbar glass" role="region" aria-label="Data source and season">
      <p id="source" class="source"></p>
      <div class="toolbar-actions">
        <div id="toolbar-season" class="field inline" hidden>
          <label for="season">Season</label>
          <select id="season"></select>
        </div>
        <button id="use-local" type="button" class="btn ghost sm" hidden>Use this device’s data</button>
        <label class="btn ghost sm file-btn">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>
          Open backup<input type="file" accept="application/json,.json" class="sr-only" data-file>
        </label>
      </div>
    </div>

    <p id="alert" class="alert" role="alert" hidden></p>

    <main id="content" class="content" tabindex="-1">
      <p class="muted loading">Loading standings…</p>
    </main>

    <footer class="site-foot muted small">
      Read-only view. Data is saved in each browser. Open a backup JSON from your host to see standings on another device.
    </footer>
  </div>

  <dialog id="player-dlg" class="dialog glass" aria-labelledby="player-dlg-title">
    <div class="dialog-head">
      <h2 id="player-dlg-title"></h2>
      <button id="player-dlg-close" type="button" class="btn icon" aria-label="Close">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="player-dlg-body" class="dialog-body"></div>
  </dialog>

  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
