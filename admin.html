<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Admin console for the Texas Hold'em chip, points and dealer tracker.">
  <title>Admin · Hold'em Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2310b981'/%3E%3Cpath d='M16 7c-4 5-8 7-8 11a4 4 0 0 0 7 2.6L14 25h4l-1-4.4A4 4 0 0 0 24 18c0-4-4-6-8-11z' fill='%23052e22'/%3E%3C/svg%3E">
  <script src="assets/admin/theme.js"></script>
  <link rel="stylesheet" href="assets/admin/admin.css">
  <script type="module" src="assets/admin/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="backdrop" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <!-- PIN lock -->
  <main id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card glass" novalidate>
      <div class="brand-mark lg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4-7 6.3-7 10a4 4 0 0 0 6.2 3.3L10 21h4l-1.2-5.2A4 4 0 0 0 19 12.5c0-3.7-4-6-7-10z"/></svg>
      </div>
      <h1 id="lock-title">Enter admin PIN</h1>
      <p id="lock-desc" class="muted"></p>
      <div class="field">
        <label for="pin">PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" maxlength="8" required aria-describedby="lock-error">
      </div>
      <div class="field" id="pin-confirm-field" hidden>
        <label for="pin-confirm">Confirm PIN</label>
        <input id="pin-confirm" name="confirm" type="password" inputmode="numeric" pattern="\d{4,8}" maxlength="8" autocomplete="new-password">
      </div>
      <p id="lock-error" class="form-error" role="alert"></p>
      <button id="lock-submit" type="submit" class="btn primary block">Unlock</button>
      <div class="lock-foot">
        <button id="lock-forgot" type="button" class="link-btn">Forgot PIN?</button>
        <a class="link-btn" href="./">Go to standings</a>
      </div>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4-7 6.3-7 10a4 4 0 0 0 6.2 3.3L10 21h4l-1.2-5.2A4 4 0 0 0 19 12.5c0-3.7-4-6-7-10z"/></svg>
        </span>
        <span class="brand-text">Hold'em Tracker</span><span class="pill">Admin</span>
      </div>
      <div class="top-actions">
        <a class="btn ghost sm" href="./">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Standings</span>
        </a>
        <button id="theme-toggle" type="button" class="btn ghost sm" aria-pressed="true" aria-label="Dark theme">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="label" aria-hidden="true">Dark</span>
        </button>
        <button id="lock-btn" type="button" class="btn ghost sm">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span>Lock</span>
        </button>
      </div>
    </header>

    <nav class="tabs-wrap" aria-label="Admin sections">
      <div id="tablist" class="tabs glass" role="tablist">
        <button id="tab-table" role="tab" data-tab="table" aria-controls="panel-table" aria-selected="true">Table<span class="tab-dot" hidden><span class="sr-only"> (game live)</span></span></button>
        <button id="tab-games" role="tab" data-tab="games" aria-controls="panel-games" aria-selected="false" tabindex="-1">Games</button>
        <button id="tab-players" role="tab" data-tab="players" aria-controls="panel-players" aria-selected="false" tabindex="-1">Players</button>
        <button id="tab-seasons" role="tab" data-tab="seasons" aria-controls="panel-seasons" aria-selected="false" tabindex="-1">Seasons</button>
        <button id="tab-settings" role="tab" data-tab="settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Settings</button>
      </div>
    </nav>

    <main id="main" class="container" tabindex="-1">
      <h1 class="sr-only">Hold'em Tracker admin</h1>
      <div id="panel-table" class="panel" role="tabpanel" aria-labelledby="tab-table" tabindex="0"></div>
      <div id="panel-games" class="panel" role="tabpanel" aria-labelledby="tab-games" tabindex="0" hidden></div>
      <div id="panel-players" class="panel" role="tabpanel" aria-labelledby="tab-players" tabindex="0" hidden></div>
      <div id="panel-seasons" class="panel" role="tabpanel" aria-labelledby="tab-seasons" tabindex="0" hidden></div>
      <div id="panel-settings" class="panel" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" hidden></div>
    </main>
  </div>

  <dialog id="dlg" class="dialog glass" aria-labelledby="dlg-title">
    <form id="dlg-form" novalidate>
      <header class="dialog-head">
        <h2 id="dlg-title"></h2>
        <button type="button" class="btn icon" data-dlg-close aria-label="Close dialog">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="dlg-body" class="dialog-body"></div>
      <p id="dlg-error" class="form-error" role="alert"></p>
      <footer class="dialog-foot">
        <button id="dlg-cancel" type="button" class="btn ghost" data-dlg-close>Cancel</button>
        <button id="dlg-ok" type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
