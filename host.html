<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Host screen for the Hold'em Chip Table: run hands while players bet from their phones.">
  <title>Chip Table Host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2310b981'/%3E%3Cpath d='M16 7c-4 5-8 7-8 11a4 4 0 0 0 7 2.6L14 25h4l-1-4.4A4 4 0 0 0 24 18c0-4-4-6-8-11z' fill='%23052e22'/%3E%3C/svg%3E">
  <script src="assets/admin/theme.js"></script>
  <link rel="stylesheet" href="assets/admin/admin.css">
  <link rel="stylesheet" href="assets/admin/host.css">
  <script src="assets/vendor/peerjs-1.5.4.min.js" defer></script>
  <script src="assets/vendor/qrcode-generator-1.4.4.js" defer></script>
  <script type="module" src="assets/admin/host.js"></script>
</head>
<body>
  <a class="skip-link" href="#host-root">Skip to table</a>
  <div class="backdrop" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <header class="topbar glass">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c-3 4-7 6.3-7 10a4 4 0 0 0 6.2 3.3L10 21h4l-1.2-5.2A4 4 0 0 0 19 12.5c0-3.7-4-6-7-10z"/></svg>
      </span>
      <span class="brand-text">Chip Table</span><span class="pill">Host</span>
    </div>
    <div class="top-actions">
      <a class="btn ghost sm" href="admin.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Admin</span>
      </a>
      <button id="theme-toggle" type="button" class="btn ghost sm" aria-pressed="true" aria-label="Dark theme">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="label" aria-hidden="true">Dark</span>
      </button>
    </div>
  </header>

  <main id="host-root" class="container" tabindex="-1">
    <p class="muted">Loading table…</p>
  </main>

  <dialog id="dlg" class="dialog glass" aria-labelledby="dlg-title">
    <form id="dlg-form" novalidate>
      <header class="dialog-head">
        <h2 id="dlg-title"></h2>
        <button id="dlg-x" type="button" class="btn icon" aria-label="Close dialog">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="dlg-body" class="dialog-body"></div>
      <footer class="dialog-foot">
        <button id="dlg-cancel" type="button" class="btn ghost">Cancel</button>
        <button id="dlg-ok" type="submit" class="btn primary">OK</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast glass" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
